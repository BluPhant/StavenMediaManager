<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Media Manager</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<nav class="navbar navbar-dark bg-dark border-bottom border-secondary sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="#/">
      <i class="bi bi-film me-2"></i>Media Manager
    </a>
    <div class="d-flex align-items-center gap-3">
      <span id="jobs-badge" class="badge bg-warning text-dark d-none">
        <i class="bi bi-gear-fill spin me-1"></i>
        <span id="active-job-count">0</span> running
      </span>
      <button class="btn btn-sm btn-outline-secondary" onclick="Router.refresh()">
        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
      </button>
    </div>
  </div>
</nav>

<div id="app" class="container-fluid py-3"></div>

<div id="jobs-panel" class="jobs-panel border-top border-secondary">
  <div class="jobs-panel-header d-flex justify-content-between align-items-center px-3 py-2"
       onclick="JobsPanel.toggle()">
    <span class="fw-semibold small">
      <i class="bi bi-list-task me-2"></i>Jobs
    </span>
    <i class="bi bi-chevron-up" id="jobs-chevron"></i>
  </div>
  <div id="jobs-panel-body" class="jobs-panel-body px-3 pb-2" style="display:none">
    <div id="jobs-list">
      <p class="text-secondary small my-2">No recent jobs.</p>
    </div>
  </div>
</div>

<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
