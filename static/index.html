<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staven Media Manager</title>
  <link rel="icon" type="image/svg+xml" href="/static/img/icon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>

<nav class="navbar navbar-dark bg-dark border-bottom border-secondary sticky-top">
  <div class="container-fluid">
    <a class="navbar-brand d-flex align-items-center gap-2" href="#/" style="text-decoration:none">
      <img src="/static/img/icon.svg" alt="SMM" width="30" height="30"
           style="border-radius:6px; flex-shrink:0"/>
      <span class="fw-bold" style="font-size:1rem; letter-spacing:.01em">
        <span class="text-white">Staven</span>
        <span class="text-white"> Media Manager</span>
      </span>
    </a>
    <div class="d-flex align-items-center gap-3">
      <a class="nav-link text-secondary small" href="#/movies" id="nav-movies-link"
         style="text-decoration:none">
        <i class="bi bi-film me-1"></i>Movies
        <span id="nav-reviews-badge" class="badge bg-warning text-dark ms-1 d-none">0</span>
      </a>
      <a class="nav-link text-secondary small" href="#/search" id="nav-search-link"
         style="text-decoration:none">
        <i class="bi bi-search me-1"></i>Search
      </a>
      <button id="jobs-badge" class="btn btn-sm btn-warning text-dark d-none"
              onclick="JobsPanel.toggle()" style="font-size:.8rem;padding:3px 10px;font-weight:600">
        <i class="bi bi-gear-fill spin me-1"></i>
        <span id="active-job-count">0</span> running
      </button>
      <a class="nav-link text-secondary small" href="#/about" id="nav-about-link"
         style="text-decoration:none">
        <i class="bi bi-info-circle me-1"></i>About
      </a>
      <button class="btn btn-sm btn-outline-secondary" onclick="Router.refresh()">
        <i class="bi bi-arrow-clockwise me-1"></i>Refresh
      </button>
    </div>
  </div>
</nav>

<div id="app" class="container-fluid py-3"></div>

<div id="jobs-panel" class="jobs-panel border-top border-secondary">
  <div class="jobs-panel-header d-flex justify-content-between align-items-center px-3 py-2"
       onclick="JobsPanel.toggle()">
    <span class="fw-semibold small">
      <i class="bi bi-list-task me-2"></i>Jobs
      <span id="jobs-panel-count" class="text-warning ms-1 d-none"></span>
    </span>
    <i class="bi bi-chevron-up" id="jobs-chevron"></i>
  </div>
  <div id="jobs-panel-body" class="jobs-panel-body px-3 pb-2" style="display:none">
    <div id="jobs-list">
      <p class="text-secondary small my-2">No recent jobs.</p>
    </div>
  </div>
</div>

<div id="toast-container" class="position-fixed top-0 end-0 p-3" style="z-index:9999"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
